name: zxlog v0.7 regression
on:
  push:
    branches:
      - feat/v0.7-resource-codec-sinks-dispatcher
  pull_request:
    branches:
      - main

jobs:
  gcc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [TEXT, BINARY, RUNTIME]
    steps:
      - uses: actions/checkout@v4
      - name: Install GN and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y generate-ninja ninja-build g++ python3 binutils
      - name: Configure
        run: gn gen out/${{ matrix.mode }} --args='zxlog_mode="${{ matrix.mode }}"'
      - name: Check GN dependency graph
        run: gn check out/${{ matrix.mode }}
      - name: Build and run integration checks
        run: ninja -C out/${{ matrix.mode }} check
